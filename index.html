<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Aasif — Creative Full-Stack Developer Portfolio</title>

    <link rel="canonical" href="https://mdportfolio-eta.vercel.app/" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Md Aasif — Creative Full-Stack Developer" />
    <meta property="og:description" content="Interactive 3D portfolio showcasing full-stack projects, built with React Three Fiber." />
    <meta property="og:image" content="https://mdportfolio-eta.vercel.app/og-preview.png" />
    <meta property="og:url" content="https://mdportfolio-eta.vercel.app/" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Md Aasif — Creative Full-Stack Developer" />
    <meta name="twitter:description" content="Interactive 3D portfolio showcasing full-stack projects, built with React Three Fiber." />
    <meta name="twitter:image" content="https://mdportfolio-eta.vercel.app/og-preview.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Md Aasif",
      "jobTitle": "Full-Stack Developer",
      "url": "https://mdportfolio-eta.vercel.app/"
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Guarantee scroll starts from top on every reload -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>
  </head>
